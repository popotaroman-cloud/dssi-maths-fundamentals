<svg viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .bowl  { fill:#999; fill-opacity:0.22; stroke:#333; stroke-width:1.4; }
    .rim   { fill:none; stroke:#333; stroke-width:1.2; stroke-dasharray:4 3; }
    .ell   { fill:none; stroke:#000; stroke-width:1.5; }
    .dot   { fill:#000; }
    .lbl   { fill:#000; font-size:13px; }
    .ax    { stroke:#000; stroke-width:1.3; }
  </style>

  <!-- tilted bowl (asymmetric due to w,b axes) -->
  <g transform="rotate(-12 210 190)">
    <path d="M 90,250 C 130,330 290,330 330,250
             C 290,175 130,175 90,250 Z" class="bowl"/>
    <path d="M 90,250 C 130,200 290,200 330,250" class="rim"/>
    <path d="M 210,60 C 150,95 115,170 115,250
             C 115,300 155,320 210,320
             C 265,320 305,300 305,250
             C 305,170 270,95 210,60 Z" class="bowl"/>
  </g>

  <!-- axes labels -->
  <line x1="20" y1="330" x2="120" y2="300" class="ax"/>
  <text x="15" y="345" class="lbl">w</text>
  <line x1="20" y1="330" x2="70" y2="270" class="ax"/>
  <text x="55" y="255" class="lbl">b</text>
  <line x1="210" y1="330" x2="210" y2="20" class="ax" stroke-dasharray="3 3"/>
  <text x="220" y="20" class="lbl">SSE</text>

  <!-- bottom of bowl -->
  <circle cx="210" cy="205" r="6" class="dot"/>
  <text x="220" y="200" class="lbl">w hat = 2, b hat = 2</text>
  <text x="220" y="216" class="lbl">SSE = 6</text>

  <!-- contour ellipses projected below -->
  <g transform="translate(0,60)">
    <ellipse cx="210" cy="270" rx="90" ry="24" class="ell" transform="rotate(-12 210 270)"/>
    <ellipse cx="210" cy="270" rx="60" ry="16" class="ell" transform="rotate(-12 210 270)"/>
    <ellipse cx="210" cy="270" rx="30" ry="8"  class="ell" transform="rotate(-12 210 270)"/>
  </g>
</svg>
