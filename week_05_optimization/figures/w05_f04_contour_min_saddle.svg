<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ell  { fill:none; stroke:#000; stroke-width:1.6; }
    .hyp  { stroke:#000; stroke-width:2; fill:none; }
    .dot  { fill:#000; }
    .arr  { stroke:#000; stroke-width:1.8; }
    .lbl  { fill:#000; font-size:13px; }
  </style>

  <!-- LEFT: minimum, concentric ellipses -->
  <g>
    <circle cx="110" cy="130" r="20" class="ell"/>
    <circle cx="110" cy="130" r="45" class="ell"/>
    <circle cx="110" cy="130" r="75" class="ell"/>
    <circle cx="110" cy="130" r="5" class="dot"/>

    <line x1="110" y1="130" x2="145" y2="95"  class="arr"/><polygon points="145,95 136,97 143,104" fill="#000"/>
    <line x1="110" y1="130" x2="145" y2="165" class="arr"/><polygon points="145,165 136,163 143,156" fill="#000"/>
    <line x1="110" y1="130" x2="75"  y2="95"  class="arr"/><polygon points="75,95 84,97 77,104" fill="#000"/>
    <line x1="110" y1="130" x2="75"  y2="165" class="arr"/><polygon points="75,165 84,163 77,156" fill="#000"/>
    <text x="110" y="225" class="lbl">ทุกทิศเพิ่ม</text>
  </g>

  <!-- RIGHT: saddle, hyperbolic contours crossing like X -->
  <g transform="translate(260,0)">
    <path d="M 90,60  C 100,90 105,110 110,130 C 115,150 120,170 130,200" class="hyp"/>
    <path d="M 130,60 C 120,90 115,110 110,130 C 105,150 100,170 90,200" class="hyp"/>
    <path d="M 40,90  C 70,100 90,110 110,130 C 130,150 150,160 180,170" class="hyp"/>
    <path d="M 40,170 C 70,160 90,150 110,130 C 130,110 150,100 180,90" class="hyp"/>
    <circle cx="110" cy="130" r="5" class="dot"/>

    <line x1="110" y1="130" x2="145" y2="130" class="arr"/><polygon points="145,130 136,126 136,134" fill="#000"/>
    <line x1="110" y1="130" x2="75"  y2="130" class="arr"/><polygon points="75,130 84,126 84,134" fill="#000"/>
    <text x="150" y="120" class="lbl">เพิ่ม</text>

    <line x1="110" y1="130" x2="110" y2="95"  class="arr"/><polygon points="110,95 106,104 114,104" fill="#000"/>
    <line x1="110" y1="130" x2="110" y2="165" class="arr"/><polygon points="110,165 106,156 114,156" fill="#000"/>
    <text x="118" y="90" class="lbl">ลด</text>

    <text x="90" y="225" class="lbl">จุดอานม้า</text>
  </g>
</svg>
