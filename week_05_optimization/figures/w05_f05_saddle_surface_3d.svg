<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .grid  { fill:#999; fill-opacity:0.22; stroke:#444; stroke-width:0.9; }
    .rim   { fill:none; stroke:#333; stroke-width:1.4; }
    .thick { stroke:#000; stroke-width:2.6; fill:none; }
    .dot   { fill:#000; }
    .lbl   { fill:#000; font-size:13px; }
  </style>

  <!-- saddle surface approximated by a warped grid mesh -->
  <g transform="translate(210,170)">
    <!-- mesh lines going one diagonal direction curving down (valley) -->
    <path class="grid" d="M -160,20 Q -80,-40 0,0 Q 80,40 160,-20
                          L 160,40 Q 80,100 0,60 Q -80,20 -160,80 Z"/>

    <path class="rim" d="M -160,20 Q -80,-40 0,0 Q 80,40 160,-20"/>
    <path class="rim" d="M -160,80 Q -80,20 0,60 Q 80,100 160,40"/>
    <path class="rim" d="M -160,20 L -160,80"/>
    <path class="rim" d="M 160,-20 L 160,40"/>
    <path class="rim" d="M 0,0 L 0,60"/>

    <!-- valley curve (concave up) -->
    <path class="thick" d="M -140,55 Q -60,5 0,30 Q 60,55 140,5"/>
    <!-- ridge curve (concave down), crossing at origin, perpendicular-ish -->
    <path class="thick" d="M -30,-25 Q -10,15 0,30 Q 10,45 30,85"/>

    <circle cx="0" cy="30" r="6" class="dot"/>
    <text x="10" y="20" class="lbl">จุดอานม้า</text>
  </g>

  <text x="60" y="30" class="lbl">ผิวรูปอานม้า: เป็นก้นแอ่งตามแนวหนึ่ง</text>
  <text x="60" y="50" class="lbl">และเป็นยอดเนินตามแนวตั้งฉาก</text>
</svg>
