<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .box   { fill:none; stroke:#000; stroke-width:1.8; }
    .dbox  { fill:none; stroke:#000; stroke-width:1.6; stroke-dasharray:6 4; }
    .lbl   { fill:#000; font-size:13px; text-anchor:middle; }
    .arc   { fill:none; stroke:#000; stroke-width:1.3; }
    .arrhd { fill:#000; }
    .small { fill:#000; font-size:11px; text-anchor:middle; }
  </style>

  <!-- five week boxes -->
  <rect x="10"  y="230" width="120" height="60" class="box"/>
  <text x="70" y="255" class="lbl">สัปดาห์ 1</text>
  <text x="70" y="272" class="lbl">สมการและผลเฉลย</text>

  <rect x="150" y="230" width="120" height="60" class="box"/>
  <text x="210" y="255" class="lbl">สัปดาห์ 2</text>
  <text x="210" y="272" class="lbl">ระบบสมการ</text>

  <rect x="290" y="230" width="120" height="60" class="box"/>
  <text x="350" y="255" class="lbl">สัปดาห์ 3</text>
  <text x="350" y="272" class="lbl">อนุพันธ์</text>

  <rect x="430" y="230" width="120" height="60" class="box"/>
  <text x="490" y="255" class="lbl">สัปดาห์ 4</text>
  <text x="490" y="272" class="lbl">อนุพันธ์ย่อย</text>

  <rect x="570" y="230" width="140" height="60" class="box"/>
  <text x="640" y="255" class="lbl">สัปดาห์ 5</text>
  <text x="640" y="272" class="lbl">การหาค่าเหมาะที่สุด</text>

  <!-- curved arrows from each week into week5 -->
  <path d="M 70,230 C 100,120 550,80 630,225" class="arc"/>
  <polygon points="630,225 618,215 622,228" class="arrhd"/>
  <text x="260" y="95" class="small">ตารางเครื่องหมาย</text>

  <path d="M 210,230 C 250,150 550,100 632,225" class="arc"/>
  <polygon points="632,225 620,217 626,229" class="arrhd"/>
  <text x="340" y="130" class="small" font-weight="bold">overdetermined ไม่มีผลเฉลย</text>

  <path d="M 350,230 C 380,175 560,140 635,225" class="arc"/>
  <polygon points="635,225 623,219 627,231" class="arrhd"/>
  <text x="460" y="165" class="small">จุดวิกฤต</text>

  <path d="M 490,230 C 520,195 570,190 638,222" class="arc"/>
  <polygon points="638,222 626,218 628,230" class="arrhd"/>
  <text x="565" y="200" class="small">อนุพันธ์ย่อยของ L(w,b)</text>

  <!-- dashed box for next course -->
  <rect x="620" y="20" width="130" height="90" class="dbox"/>
  <text x="685" y="55" class="lbl">คอร์ส</text>
  <text x="685" y="72" class="lbl">Maths for Data</text>
  <text x="685" y="89" class="lbl">Science 15 สัปดาห์</text>

  <path d="M 660,230 C 660,180 670,150 685,112" class="dbox" fill="none"/>
  <polygon points="685,112 677,120 691,120" class="arrhd"/>
  <text x="580" y="170" class="small">ถ้าแก้ grad f = 0 ตรง ๆ ไม่ได้</text>
</svg>
