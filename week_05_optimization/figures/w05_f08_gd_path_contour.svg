<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ell  { fill:none; stroke:#000; stroke-width:1.5; }
    .path { stroke:#000; stroke-width:2; fill:none; }
    .dot  { fill:#000; }
    .lbl  { fill:#000; font-size:12px; }
    .div  { stroke:#000; stroke-width:1.6; stroke-dasharray:6 4; }
  </style>

  <!-- flat ellipses (wide in x, narrow in y) centered at origin px(230,170) -->
  <ellipse cx="230" cy="170" rx="60"  ry="20" class="ell"/>
  <ellipse cx="230" cy="170" rx="110" ry="38" class="ell"/>
  <ellipse cx="230" cy="170" rx="165" ry="58" class="ell"/>

  <!-- GD path zigzagging in: (1,1)->(.75,.25)->(.5625,.0625)->(.42,.016), scale ~90px/unit for x, ~130px/unit for y -->
  <circle cx="320" cy="90"  r="5" class="dot"/><text x="326" y="86"  class="lbl">รอบ 0</text>
  <circle cx="298" cy="138" r="5" class="dot"/><text x="304" y="134" class="lbl">รอบ 1</text>
  <circle cx="280" cy="158" r="5" class="dot"/><text x="286" y="154" class="lbl">รอบ 2</text>
  <circle cx="268" cy="168" r="5" class="dot"/><text x="248" y="185" class="lbl">รอบ 3</text>
  <circle cx="230" cy="170" r="4" class="dot"/>

  <path d="M 320,90 L 298,138 L 280,158 L 268,168 L 230,170" class="path"/>

  <!-- divergence arrow: eta too large, jumps from (1,1) to (0,-2) -->
  <line x1="320" y1="90" x2="230" y2="240" class="div"/>
  <polygon points="230,240 236,228 242,236" fill="#000"/>
  <text x="130" y="260" class="lbl">eta ใหญ่เกินไป — ก้าวข้ามแล้วระเบิด</text>
</svg>
