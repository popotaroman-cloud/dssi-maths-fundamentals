<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax   { stroke:#000; stroke-width:1.5; }
    .ln   { stroke:#000; stroke-width:2; fill:none; }
    .dot  { fill:#000; }
    .lbl  { fill:#000; font-size:16px; text-anchor:middle; }
    .cap  { fill:#000; font-size:15px; text-anchor:middle; }
  </style>

  <!-- panel 1: unique solution -->
  <g>
    <line x1="20" y1="130" x2="220" y2="130" class="ax"/>
    <line x1="120" y1="30" x2="120" y2="230" class="ax"/>
    <line x1="40" y1="200" x2="200" y2="60" class="ln"/>
    <line x1="40" y1="60" x2="200" y2="200" class="ln"/>
    <circle cx="120" cy="130" r="5" class="dot"/>
    <text x="120" y="250" class="cap">ผลเฉลยเดียว</text>
  </g>

  <!-- panel 2: no solution (parallel) -->
  <g>
    <line x1="260" y1="130" x2="460" y2="130" class="ax"/>
    <line x1="360" y1="30" x2="360" y2="230" class="ax"/>
    <line x1="280" y1="190" x2="440" y2="70" class="ln"/>
    <line x1="290" y1="220" x2="450" y2="100" class="ln"/>
    <text x="360" y="250" class="cap">ไม่มีผลเฉลย</text>
  </g>

  <!-- panel 3: infinite solutions (coincident) -->
  <g>
    <line x1="500" y1="130" x2="700" y2="130" class="ax"/>
    <line x1="600" y1="30" x2="600" y2="230" class="ax"/>
    <line x1="520" y1="190" x2="680" y2="70" class="ln" stroke-width="4"/>
    <text x="600" y="250" class="cap">ผลเฉลยมากมาย</text>
  </g>
</svg>
