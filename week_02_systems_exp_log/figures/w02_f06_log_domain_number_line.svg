<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax    { stroke:#000; stroke-width:2; }
    .shade { stroke:none; fill:#000; fill-opacity:0.12; }
    .dot   { fill:#000; }
    .odot  { fill:#fff; stroke:#000; stroke-width:2; }
    .tick  { stroke:#000; stroke-width:1.3; }
    .lbl   { fill:#000; font-size:14px; text-anchor:middle; }
    .flag  { fill:#000; font-size:14px; }
  </style>

  <!-- number line from -6 to 6, scale 50px/unit, x=0 at px 320 -->
  <line x1="20" y1="90" x2="620" y2="90" class="ax"/>
  <polygon points="620,90 610,84 610,96" fill="#000"/>
  <polygon points="20,90 30,84 30,96" fill="#000"/>

  <!-- ticks every integer -->
  <g>
    <!-- domain x>3 shaded from px 470 (x=3) to 620 -->
    <rect x="470" y="80" width="150" height="20" class="shade"/>
  </g>

  <!-- ticks -6..6 -->
  <line x1="20"  y1="84" x2="20"  y2="96" class="tick"/><text x="20"  y="115" class="lbl">-6</text>
  <line x1="70"  y1="84" x2="70"  y2="96" class="tick"/><text x="70"  y="115" class="lbl">-5</text>
  <line x1="120" y1="84" x2="120" y2="96" class="tick"/><text x="120" y="115" class="lbl">-4</text>
  <line x1="170" y1="84" x2="170" y2="96" class="tick"/><text x="170" y="115" class="lbl">-3</text>
  <line x1="220" y1="84" x2="220" y2="96" class="tick"/><text x="220" y="115" class="lbl">-2</text>
  <line x1="270" y1="84" x2="270" y2="96" class="tick"/><text x="270" y="115" class="lbl">-1</text>
  <line x1="320" y1="84" x2="320" y2="96" class="tick"/><text x="320" y="115" class="lbl">0</text>
  <line x1="370" y1="84" x2="370" y2="96" class="tick"/><text x="370" y="115" class="lbl">1</text>
  <line x1="420" y1="84" x2="420" y2="96" class="tick"/><text x="420" y="115" class="lbl">2</text>
  <circle cx="470" cy="90" r="7" class="odot"/><text x="470" y="115" class="lbl">3</text>
  <line x1="520" y1="84" x2="520" y2="96" class="tick"/><text x="520" y="115" class="lbl">4</text>
  <circle cx="570" cy="90" r="7" class="dot"/><text x="570" y="115" class="lbl">5</text>
  <line x1="620" y1="84" x2="620" y2="96" class="tick"/><text x="620" y="115" class="lbl">6</text>

  <!-- point x=-5 with dashed circle + arrow -->
  <circle cx="70" cy="90" r="7" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="3 2"/>
  <line x1="90" y1="140" x2="72" y2="100" stroke="#000" stroke-width="1.3"/>
  <polygon points="72,100 76,110 82,102" fill="#000"/>
  <text x="120" y="150" class="flag">✗ แปลกปลอม — โดเมนห้าม</text>

  <text x="570" y="150" class="flag">x=5 : ผลเฉลยจริง</text>
  <text x="545" y="55" class="flag">โดเมนที่ใช้ได้ (x &gt; 3)</text>
</svg>
