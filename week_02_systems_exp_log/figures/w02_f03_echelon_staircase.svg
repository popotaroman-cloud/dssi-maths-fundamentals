<svg viewBox="0 -18 460 318" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .cell   { fill:none; stroke:#000; stroke-width:1.2; }
    .pivot  { fill:#ccc; stroke:#000; stroke-width:1.2; }
    .val    { fill:#000; font-size:18px; text-anchor:middle; dominant-baseline:middle; }
    .lbl    { fill:#000; font-size:14px; text-anchor:middle; }
    .stair  { stroke:#000; stroke-width:3; fill:none; }
    .sep    { stroke:#000; stroke-width:1.5; stroke-dasharray:5 4; }
    .arrow  { stroke:#000; stroke-width:1.6; fill:none; }
  </style>

  <!-- row1: [1, 2, 0 | 4]  pivot col0 -->
  <!-- row2: [0, 0, 1 | 3]  pivot col2 (col1 = free variable) -->
  <!-- row3: [0, 0, 0 | 0]  zero row -->

  <rect x="40"  y="30" width="80" height="60" class="pivot"/>
  <rect x="120" y="30" width="80" height="60" class="cell"/>
  <rect x="200" y="30" width="80" height="60" class="cell"/>
  <rect x="280" y="30" width="80" height="60" class="cell"/>

  <rect x="40"  y="90" width="80" height="60" class="cell"/>
  <rect x="120" y="90" width="80" height="60" class="cell"/>
  <rect x="200" y="90" width="80" height="60" class="pivot"/>
  <rect x="280" y="90" width="80" height="60" class="cell"/>

  <rect x="40"  y="150" width="80" height="60" class="cell"/>
  <rect x="120" y="150" width="80" height="60" class="cell"/>
  <rect x="200" y="150" width="80" height="60" class="cell"/>
  <rect x="280" y="150" width="80" height="60" class="cell"/>

  <text x="80" y="60" class="val">1</text>
  <text x="160" y="60" class="val">2</text>
  <text x="240" y="60" class="val">0</text>
  <text x="320" y="60" class="val">4</text>

  <text x="80" y="120" class="val">0</text>
  <text x="160" y="120" class="val">0</text>
  <text x="240" y="120" class="val">1</text>
  <text x="320" y="120" class="val">3</text>

  <text x="80" y="180" class="val">0</text>
  <text x="160" y="180" class="val">0</text>
  <text x="240" y="180" class="val">0</text>
  <text x="320" y="180" class="val">0</text>

  <!-- pivot circles -->
  <circle cx="80" cy="60" r="26" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="240" cy="120" r="26" fill="none" stroke="#000" stroke-width="2"/>

  <!-- augmented column separator -->
  <line x1="280" y1="30" x2="280" y2="210" class="sep"/>

  <!-- staircase line through pivots -->
  <path d="M 40,30 L 120,30 L 120,90 L 200,90 L 200,150 L 280,150" class="stair"/>

  <!-- free variable arrow above column 1 (x=120-200) -->
  <line x1="160" y1="30" x2="160" y2="12" class="arrow"/>
  <polygon points="160,4 154,16 166,16" fill="#000"/>
  <text x="160" y="0" class="lbl">ตัวแปรอิสระ</text>

  <text x="240" y="250" class="lbl">วงกลม = ตำแหน่ง pivot · เส้นหนา = ขั้นบันได</text>
  <text x="240" y="270" class="lbl">คอลัมน์ที่ไม่มี pivot (มีลูกศรชี้) = ตัวแปรอิสระ</text>
</svg>
