<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax   { stroke:#000; stroke-width:1.5; }
    .curve{ stroke:#000; stroke-width:2.2; fill:none; }
    .diag { stroke:#000; stroke-width:1.2; stroke-dasharray:6 4; }
    .dot  { fill:#000; }
    .lbl  { fill:#000; font-size:14px; }
    .arr  { stroke:#000; stroke-width:1.2; }
  </style>

  <!-- axes centered at (60,340), scale: 1 unit = 45px -->
  <line x1="20" y1="340" x2="400" y2="340" class="ax"/>
  <line x1="60" y1="400" x2="60" y2="20" class="ax"/>
  <text x="405" y="345" class="lbl">x</text>
  <text x="40" y="20" class="lbl">y</text>

  <!-- y = x diagonal -->
  <line x1="60" y1="340" x2="360" y2="40" class="diag"/>
  <text x="330" y="55" class="lbl">y = x</text>

  <!-- y = 2^x through (0,1)(1,2)(2,4) : px x=60+45t, y=340-45(2^t) -->
  <path d="M 60,295
           C 105,290 130,270 150,250
           C 175,225 195,190 210,160
           C 225,130 235,100 240,70" class="curve"/>
  <circle cx="60" cy="295" r="4" class="dot"/>
  <circle cx="105" cy="250" r="4" class="dot"/>
  <circle cx="150" cy="160" r="4" class="dot"/>
  <text x="150" y="145" class="lbl">y = 2^x</text>

  <!-- y = log2(x) through (1,0)(2,1)(4,2): mirror of above about y=x -->
  <path d="M 295,340
           C 290,295 270,270 250,250
           C 225,225 190,205 160,195
           C 130,185 100,180 70,178" class="curve"/>
  <circle cx="295" cy="340" r="4" class="dot"/>
  <circle cx="250" cy="295" r="4" class="dot"/>
  <circle cx="160" cy="250" r="4" class="dot"/>
  <text x="255" y="320" class="lbl">y = log2(x)</text>

  <!-- asymptotes -->
  <line x1="20" y1="340" x2="400" y2="340" class="ax" opacity="0"/>
  <line x1="60" y1="340" x2="60" y2="20" class="ax" opacity="0"/>

  <!-- connecting arrow between mirrored points (1,2) and (2,1) -->
  <line x1="105" y1="250" x2="250" y2="295" class="arr" stroke-dasharray="3 3"/>
</svg>
