<svg viewBox="0 0 440 420" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax    { stroke:#000; stroke-width:1.5; }
    .curve { stroke:#000; stroke-width:2.4; fill:none; }
    .dashc { stroke:#000; stroke-width:1.2; fill:none; stroke-dasharray:5 4; }
    .dot   { fill:#000; }
    .vel   { stroke:#000; stroke-width:2.2; }
    .grad  { stroke:#000; stroke-width:2.2; }
    .lbl   { fill:#000; font-size:13px; }
    .sq    { fill:none; stroke:#000; stroke-width:1.4; }
  </style>

  <line x1="20" y1="220" x2="420" y2="220" class="ax"/>
  <line x1="220" y1="400" x2="220" y2="20" class="ax"/>
  <text x="425" y="224" class="lbl">x</text>
  <text x="205" y="18" class="lbl">y</text>

  <!-- xy=6 quadrant1 branch (through (2,3) approx) scale 30px/unit -->
  <path d="M 232,340 C 235,290 245,220 260,140 C 280,90 320,65 370,55" class="curve"/>
  <text x="330" y="48" class="lbl">level curve ระดับ 6 = เส้นทางที่เดิน</text>

  <!-- dashed neighboring levels 4 and 9 -->
  <path d="M 210,340 C 215,270 230,180 260,110 C 290,60 330,40 380,30" class="dashc"/>
  <path d="M 250,340 C 255,290 265,230 290,170 C 315,120 350,100 390,90" class="dashc"/>

  <!-- point (2,3) -->
  <circle cx="280" cy="130" r="6" class="dot"/>

  <!-- velocity vector (1,-1.5) tangent direction, pointing down-right -->
  <line x1="280" y1="130" x2="340" y2="175" class="vel"/>
  <polygon points="340,175 330,172 335,182" fill="#000"/>
  <text x="345" y="180" class="lbl">เวกเตอร์ความเร็ว (1,-3/2)</text>

  <!-- gradient vector (3,2) perpendicular, pointing up-right -->
  <line x1="280" y1="130" x2="322" y2="98" class="grad"/>
  <polygon points="322,98 312,100 318,108" fill="#000"/>
  <text x="326" y="95" class="lbl">∇f = (3,2)</text>

  <!-- right angle mark -->
  <rect x="292" y="118" width="10" height="10" class="sq" transform="rotate(-33 297 123)"/>

  <text x="120" y="380" class="lbl">ตั้งฉากกัน จึง dz/dt = 0</text>
</svg>
