<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax    { stroke:#000; stroke-width:1.5; }
    .ell   { fill:none; stroke:#000; stroke-width:1.6; }
    .hline { stroke:#000; stroke-width:2.4; }
    .curve { stroke:#000; stroke-width:2.2; fill:none; }
    .tan   { stroke:#000; stroke-width:1.8; }
    .dot   { fill:#000; }
    .lbl   { fill:#000; font-size:13px; }
    .arr   { stroke:#000; stroke-width:1.2; stroke-dasharray:4 3; }
  </style>

  <!-- LEFT: contour map -->
  <g>
    <line x1="20" y1="130" x2="220" y2="130" class="ax"/>
    <line x1="120" y1="240" x2="120" y2="20" class="ax"/>
    <ellipse cx="120" cy="130" rx="30" ry="20" class="ell"/>
    <ellipse cx="120" cy="130" rx="60" ry="40" class="ell"/>
    <ellipse cx="120" cy="130" rx="90" ry="60" class="ell"/>

    <!-- horizontal line y=1 (px 90) -->
    <line x1="30" y1="90" x2="210" y2="90" class="hline"/>
    <text x="35" y="82" class="lbl">ตรึง y=1</text>

    <circle cx="165" cy="90" r="5" class="dot"/>
    <text x="170" y="105" class="lbl">(2,1)</text>
  </g>

  <!-- RIGHT: cross-section graph g(x) = f(x,1) -->
  <g transform="translate(250,0)">
    <line x1="20" y1="220" x2="220" y2="220" class="ax"/>
    <line x1="60" y1="240" x2="60" y2="20" class="ax"/>
    <text x="30" y="15" class="lbl">z</text>
    <text x="225" y="224" class="lbl">x</text>

    <path d="M 70,60 C 100,120 130,180 160,205 C 175,213 190,216 200,218" class="curve"/>
    <circle cx="150" cy="190" r="5" class="dot"/>
    <text x="155" y="185" class="lbl">g(x)=f(x,1)</text>

    <!-- tangent at x=2 -->
    <line x1="100" y1="235" x2="200" y2="145" class="tan"/>
    <text x="160" y="140" class="lbl">ความชัน = f_x(2,1)</text>
  </g>

  <!-- connecting dashed arrow between the two panels -->
  <line x1="185" y1="90" x2="400" y2="190" class="arr"/>
</svg>
