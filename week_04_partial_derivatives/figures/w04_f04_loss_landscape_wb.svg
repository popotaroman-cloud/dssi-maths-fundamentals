<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax   { stroke:#000; stroke-width:1.5; }
    .ell  { fill:none; stroke:#000; stroke-width:1.6; }
    .dot  { fill:#000; }
    .lbl  { fill:#000; font-size:13px; }
    .cross{ stroke:#000; stroke-width:2; }
  </style>

  <line x1="30" y1="330" x2="430" y2="330" class="ax"/>
  <line x1="60" y1="360" x2="60" y2="20" class="ax"/>
  <text x="435" y="334" class="lbl">w</text>
  <text x="40" y="20" class="lbl">b</text>

  <!-- nested tilted ellipses centered around (250,180) representing minimum -->
  <g transform="rotate(-25 250 180)">
    <ellipse cx="250" cy="180" rx="30"  ry="14" class="ell"/>
    <ellipse cx="250" cy="180" rx="70"  ry="34" class="ell"/>
    <ellipse cx="250" cy="180" rx="115" ry="56" class="ell"/>
    <ellipse cx="250" cy="180" rx="165" ry="80" class="ell"/>
  </g>

  <text x="360" y="130" class="lbl">L=12</text>
  <text x="330" y="160" class="lbl">L=6</text>
  <text x="295" y="185" class="lbl">L=2</text>
  <text x="260" y="205" class="lbl">L=1</text>

  <!-- points -->
  <circle cx="250" cy="180" r="5" class="dot"/>
  <text x="258" y="176" class="lbl">(1,1)  L=1</text>

  <circle cx="330" cy="220" r="5" class="dot"/>
  <text x="336" y="235" class="lbl">(2,0)  L=2</text>

  <circle cx="180" cy="230" r="5" class="dot"/>
  <text x="130" y="248" class="lbl">(1,0)  L=6</text>

  <!-- cross at innermost center -->
  <line x1="243" y1="180" x2="257" y2="180" class="cross"/>
  <line x1="250" y1="173" x2="250" y2="187" class="cross"/>
  <text x="255" y="150" class="lbl">จุดที่ยังไม่หา — สัปดาห์ 5</text>
</svg>
