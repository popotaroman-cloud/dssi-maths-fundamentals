<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .curve { stroke:#000; stroke-width:2.2; fill:none; }
    .thin  { stroke:#666; stroke-width:1.3; }
    .thick { stroke:#000; stroke-width:2.8; }
    .dot   { fill:#000; }
    .lbl   { fill:#000; font-size:13px; }
  </style>

  <!-- upward parabola-like curve -->
  <path d="M 30,290 C 100,270 150,220 200,170 C 250,120 300,70 380,20" class="curve"/>

  <!-- fixed point (a,f(a)) -->
  <circle cx="200" cy="170" r="6" class="dot"/>
  <text x="150" y="200" class="lbl">(a, f(a))</text>

  <!-- three secant points at decreasing h -->
  <circle cx="340" cy="45" r="4" class="dot"/>
  <text x="345" y="40" class="lbl">h=2</text>
  <circle cx="290" cy="80" r="4" class="dot"/>
  <text x="295" y="75" class="lbl">h=1</text>
  <circle cx="255" cy="118" r="4" class="dot"/>
  <text x="260" y="112" class="lbl">h=0.5</text>

  <!-- secant lines (thin) from (200,170) to each -->
  <line x1="200" y1="170" x2="340" y2="45" class="thin"/>
  <line x1="200" y1="170" x2="290" y2="80" class="thin"/>
  <line x1="200" y1="170" x2="255" y2="118" class="thin"/>

  <!-- tangent line (thick), touching only at fixed point -->
  <line x1="120" y1="250" x2="300" y2="70" class="thick"/>
  <text x="305" y="65" class="lbl">เส้นสัมผัส ความชัน f'(a)</text>
</svg>
