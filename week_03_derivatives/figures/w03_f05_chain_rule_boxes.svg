<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .outer { fill:none; stroke:#000; stroke-width:2.2; }
    .inner { fill:none; stroke:#000; stroke-width:2; }
    .lbl   { fill:#000; font-size:15px; text-anchor:middle; }
    .arc   { fill:none; stroke:#000; stroke-width:1.6; }
  </style>

  <rect x="40" y="40" width="340" height="220" rx="14" class="outer"/>
  <text x="210" y="70" class="lbl">ฟังก์ชันนอก f</text>

  <rect x="130" y="110" width="160" height="100" rx="10" class="inner"/>
  <text x="210" y="165" class="lbl">ฟังก์ชันใน g(x)</text>

  <!-- large circular arrow around outer box -->
  <path d="M 380,150 A 190,110 0 1 1 375,170" class="arc" marker-end="url(#arrow)"/>
  <text x="210" y="300" class="lbl">คูณด้วย f'(g(x))</text>

  <!-- small circular arrow around inner box -->
  <path d="M 290,160 A 80,50 0 1 1 288,175" class="arc" marker-end="url(#arrow)"/>
  <text x="210" y="235" class="lbl">คูณด้วย g'(x)</text>

  <text x="330" y="290" class="lbl" font-size="20">×</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>
</svg>
