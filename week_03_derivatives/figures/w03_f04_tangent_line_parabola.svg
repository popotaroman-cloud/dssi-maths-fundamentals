<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax    { stroke:#000; stroke-width:1.5; }
    .curve { stroke:#000; stroke-width:2.2; fill:none; }
    .tan   { stroke:#000; stroke-width:2; }
    .dot   { fill:#000; }
    .lbl   { fill:#000; font-size:14px; }
    .dash  { stroke:#000; stroke-width:1; stroke-dasharray:4 3; }
  </style>

  <!-- x: -1..5 -> px 40..440 (step 66.7/unit), y: -10..26 -> px 300..20 (step 7.8/unit) -->
  <line x1="20" y1="222" x2="460" y2="222" class="ax"/>
  <line x1="107" y1="310" x2="107" y2="20" class="ax"/>
  <text x="465" y="226" class="lbl">x</text>
  <text x="90" y="20" class="lbl">y</text>

  <!-- y = x^2 -->
  <path d="M 60,275 C 100,230 140,195 175,175 C 210,155 250,148 280,155 C 320,165 360,195 400,240 C 420,265 435,285 445,300" class="curve"/>

  <!-- point (3,9): px x=107+3*66.7=307, y=222-9*7.8=152 -->
  <circle cx="307" cy="152" r="5" class="dot"/>

  <!-- tangent y=6x-9: at x=1 (px173) y=-3(px245); at x=4.3(px394) y=17.8(px83) -->
  <line x1="150" y1="260" x2="400" y2="70" class="tan"/>
  <text x="405" y="65" class="lbl">y = 6x - 9</text>

  <!-- x-intercept x=1.5 px=207, y-intercept y=-9 px=292 -->
  <line x1="207" y1="222" x2="207" y2="222" class="dash"/>
  <circle cx="207" cy="222" r="3" fill="#000"/>
  <line x1="107" y1="292" x2="107" y2="292" class="dash"/>
  <circle cx="107" cy="292" r="3" fill="#000"/>
  <line x1="207" y1="222" x2="207" y2="290" class="dash"/>
  <line x1="60" y1="292" x2="107" y2="292" class="dash"/>
</svg>
