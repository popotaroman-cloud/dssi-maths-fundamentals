<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax    { stroke:#000; stroke-width:1.5; }
    .curve { stroke:#000; stroke-width:2.2; fill:none; }
    .sec   { stroke:#000; stroke-width:1.8; }
    .dot   { fill:#000; }
    .lbl   { fill:#000; font-size:14px; }
    .tri   { stroke:#000; stroke-width:1.2; stroke-dasharray:5 4; fill:none; }
  </style>

  <line x1="30" y1="280" x2="440" y2="280" class="ax"/>
  <line x1="60" y1="300" x2="60" y2="20" class="ax"/>
  <text x="445" y="284" class="lbl">x</text>
  <text x="40" y="20" class="lbl">y</text>

  <!-- y=x^2, x:0..3.2 -> px 60..410 (step 110/unit), y:0..10 -> px 280..40 (step 24/unit) -->
  <path d="M 60,280 C 130,275 170,250 200,220 C 240,180 280,120 320,60 C 340,35 360,10 370,0" class="curve"/>

  <!-- points (1,1) px(170,256) and (3,9) px(390,64) -->
  <circle cx="170" cy="256" r="5" class="dot"/>
  <circle cx="390" cy="64" r="5" class="dot"/>

  <!-- secant line through both, extended slightly -->
  <line x1="140" y1="292" x2="420" y2="28" class="sec"/>
  <text x="330" y="30" class="lbl">เส้นตัดวง ความชัน = 4</text>

  <!-- right triangle: horizontal from (170,256) to (390,256), vertical up to (390,64) -->
  <line x1="170" y1="256" x2="390" y2="256" class="tri"/>
  <line x1="390" y1="256" x2="390" y2="64" class="tri"/>
  <text x="270" y="272" class="lbl">Δx = 2</text>
  <text x="398" y="165" class="lbl">Δy = 8</text>
</svg>
