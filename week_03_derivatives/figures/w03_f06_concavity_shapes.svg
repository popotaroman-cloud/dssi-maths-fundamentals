<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .box  { fill:none; stroke:#000; stroke-width:1.3; }
    .curve{ stroke:#000; stroke-width:2.4; fill:none; }
    .lbl  { fill:#000; font-size:13px; text-anchor:middle; }
  </style>

  <!-- 2x2 grid of boxes, each 180x120 -->
  <rect x="20"  y="20"  width="180" height="120" class="box"/>
  <rect x="220" y="20"  width="180" height="120" class="box"/>
  <rect x="20"  y="170" width="180" height="120" class="box"/>
  <rect x="220" y="170" width="180" height="120" class="box"/>

  <!-- top-left: increasing, concave up (accelerating rise) -->
  <path d="M 40,120 C 90,115 130,95 180,40" class="curve"/>
  <text x="110" y="155" class="lbl">เพิ่มขึ้น เว้าขึ้น</text>

  <!-- top-right: increasing, concave down (decelerating rise) -->
  <path d="M 240,120 C 280,60 320,40 380,35" class="curve"/>
  <text x="310" y="155" class="lbl">เพิ่มขึ้น เว้าลง</text>

  <!-- bottom-left: decreasing, concave up (decelerating fall) -->
  <path d="M 40,60 C 80,90 130,110 180,115" class="curve"/>
  <text x="110" y="305" class="lbl">ลดลง เว้าขึ้น</text>

  <!-- bottom-right: decreasing, concave down (accelerating fall) -->
  <path d="M 240,45 C 290,55 330,80 380,190" class="curve"/>
  <text x="310" y="305" class="lbl">ลดลง เว้าลง</text>
</svg>
