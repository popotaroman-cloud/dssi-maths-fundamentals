<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .curve { fill:none; stroke:#000; stroke-width:2.5; }
    .axis  { stroke:#000; stroke-width:1.5; }
    .lbl   { fill:#000; font-size:17px; text-anchor:middle; }
    .dot   { fill:#000; }
  </style>

  <!-- Panel 1: D > 0 — ตัดแกน x สองจุด -->
  <line x1="15" y1="150" x2="185" y2="150" class="axis"/>
  <path d="M 40,40 Q 100,340 160,40" class="curve"/>
  <circle cx="66" cy="150" r="4" class="dot"/>
  <circle cx="134" cy="150" r="4" class="dot"/>
  <text x="100" y="195" class="lbl">D &gt; 0</text>

  <!-- Panel 2: D = 0 — แตะแกน x จุดเดียว -->
  <line x1="215" y1="150" x2="385" y2="150" class="axis"/>
  <path d="M 240,40 Q 300,260 360,40" class="curve"/>
  <circle cx="300" cy="150" r="4" class="dot"/>
  <text x="300" y="195" class="lbl">D = 0</text>

  <!-- Panel 3: D < 0 — ลอยเหนือแกน x -->
  <line x1="415" y1="150" x2="585" y2="150" class="axis"/>
  <path d="M 440,40 Q 500,160 560,40" class="curve"/>
  <text x="500" y="195" class="lbl">D &lt; 0</text>
</svg>
