<svg viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg" font-family="'TH Sarabun New','Noto Sans Thai',sans-serif">
  <style>
    .ax    { stroke:#000; stroke-width:2; }
    .lbl   { fill:#000; font-size:16px; text-anchor:middle; }
    .rowlbl{ fill:#000; font-size:15px; }
    .sign  { fill:#000; font-size:18px; text-anchor:middle; font-weight:bold; }
  </style>

  <!-- เส้นจำนวน -->
  <line x1="40" y1="60" x2="560" y2="60" class="ax"/>
  <polygon points="560,60 550,54 550,66" fill="#000"/>

  <!-- จุดวิกฤต x=1 (ไม่นิยาม, วงกลมโปร่ง) -->
  <circle cx="160" cy="60" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="160" y="40" class="lbl">1 (ไม่นิยาม)</text>

  <!-- จุดวิกฤต x=5 (รวม, วงกลมทึบ) -->
  <circle cx="400" cy="60" r="6" fill="#000"/>
  <text x="400" y="40" class="lbl">5</text>

  <!-- แถบคำตอบ (1,5] ใต้เส้นจำนวน -->
  <rect x="160" y="70" width="240" height="10" fill="#000"/>
  <circle cx="160" cy="75" r="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="400" cy="75" r="5" fill="#000"/>

  <!-- แถวเครื่องหมาย -->
  <text x="42" y="130" class="rowlbl">เศษ (5 − x)</text>
  <line x1="180" y1="122" x2="580" y2="122" stroke="#ccc" stroke-width="1"/>
  <text x="100" y="130" class="sign">+</text>
  <text x="280" y="130" class="sign">+</text>
  <text x="480" y="130" class="sign">−</text>

  <text x="42" y="165" class="rowlbl">ส่วน (x − 1)</text>
  <text x="100" y="165" class="sign">−</text>
  <text x="280" y="165" class="sign">+</text>
  <text x="480" y="165" class="sign">+</text>

  <text x="42" y="200" class="rowlbl">ผลหาร</text>
  <text x="100" y="200" class="sign">−</text>
  <text x="280" y="200" class="sign">+</text>
  <text x="480" y="200" class="sign">−</text>

  <!-- เส้นแบ่งช่วงแนวตั้งบาง ๆ ในแถวเครื่องหมาย -->
  <line x1="160" y1="105" x2="160" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="400" y1="105" x2="400" y2="210" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="300" y="240" class="lbl" font-size="17">คำตอบ: (1, 5]</text>
</svg>
